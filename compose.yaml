name: airtmn
services:
  app:
    build: .
    image: airtmn:${CATALOG_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://catalog@database:5432/catalog
      CATALOG_DATABASE_PASSWORD_FILE: /run/secrets/database_password
      CATALOG_SERVER_MODE: '1'
      CATALOG_COOKIE_SECURE: '1'
      CATALOG_PUBLIC_ORIGIN: https://${CATALOG_DOMAIN:?Run python3 deploy/configure.py first}
      CATALOG_ADMIN_USERNAME: ${CATALOG_ADMIN_USERNAME:-admin}
      CATALOG_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
      - database_password
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - catalog_data:/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      CATALOG_DOMAIN: ${CATALOG_DOMAIN:?Run python3 deploy/configure.py first}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalog -d catalog']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
secrets:
  admin_password:
    file: ./deploy/secrets/admin_password
  database_password:
    file: ./deploy/secrets/database_password
volumes:
  catalog_data:
  caddy_data:
  caddy_config:
  postgres_data:
networks:
  backend:
    internal: true
  edge:
